<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Archery Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #fff;
            background: #2ed573;
            overflow: hidden;
            cursor: crosshair;
            image-rendering: pixelated;
        }
        #score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 2px solid #fff;
            letter-spacing: 2px;
            z-index: 10;
        }
        #feedback-display {
            position: absolute;
            top: 120px;
            width: 100%;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 4px 4px #000;
            display: none;
            pointer-events: none;
            letter-spacing: 3px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">SCORE: 0</div>
        <div id="feedback-display"></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const feedbackDisplay = document.getElementById('feedback-display');

        let score = 0;

        // Perfectly centered target configuration
        const target = {
            x: 400,
            y: 200,
            radius: 80
        };

        // Aiming and shooting state
        let isAiming = false;
        let startX = 400;
        let startY = 500;
        let currentX = 400;
        let currentY = 500;

        let flyingArrow = null;
        let stuckArrows = []; 
        let feedbackTimeout = null;

        // Unified input coordinates helper (Mouse & Touch)
        function getClientPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        // Event Listeners for PC and Mobile support
        canvas.addEventListener('mousedown', startAim);
        canvas.addEventListener('touchstart', startAim);

        canvas.addEventListener('mousemove', moveAim);
        canvas.addEventListener('touchmove', moveAim);

        window.addEventListener('mouseup', releaseArrow);
        window.addEventListener('touchend', releaseArrow);

        function startAim(e) {
            if (flyingArrow) return;
            const pos = getClientPos(e);

            // Allow clicking/touching anywhere near the bottom bow area to pull back
            if (Math.hypot(pos.x - 400, pos.y - 500) < 150) {
                isAiming = true;
                startX = 400;
                startY = 500;
                currentX = pos.x;
                currentY = pos.y;
                e.preventDefault();
            }
        }

        function moveAim(e) {
            if (!isAiming) return;
            const pos = getClientPos(e);
            currentX = pos.x;
            currentY = pos.y;
            e.preventDefault();
        }

        function releaseArrow(e) {
            if (!isAiming) return;
            isAiming = false;

            // Calculate pull vector (pulling back shoots forward toward target)
            const dx = startX - currentX;
            const dy = startY - currentY;

            // Scale velocity to map pull accurately to the centered target space
            flyingArrow = {
                x: 400,
                y: 500,
                vx: dx * 0.1,
                vy: dy * 0.1,
                scale: 1.0
            };
        }

        function showFeedback(text, color) {
            feedbackDisplay.innerText = text;
            feedbackDisplay.style.color = color;
            feedbackDisplay.style.display = 'block';

            if (feedbackTimeout) clearTimeout(feedbackTimeout);

            feedbackTimeout = setTimeout(() => {
                feedbackDisplay.style.display = 'none';
            }, 3000);
        }

        function update() {
            if (flyingArrow) {
                flyingArrow.x += flyingArrow.vx;
                flyingArrow.y += flyingArrow.vy;
                flyingArrow.scale -= 0.025; // Shrinks to simulate distance depth

                // Arrow hits impact depth threshold
                if (flyingArrow.scale <= 0.3) {
                    const dist = Math.hypot(flyingArrow.x - target.x, flyingArrow.y - target.y);

                    if (dist < target.radius) {
                        // Precise scoring zones
                        let points = 2;
                        if (dist < 15) points = 10;       // Bullseye
                        else if (dist < 40) points = 5;   // Inner Ring

                        score += points;
                        scoreBoard.innerText = `SCORE: ${score}`;

                        const savedArrow = { x: flyingArrow.x, y: flyingArrow.y };
                        stuckArrows.push(savedArrow);

                        setTimeout(() => {
                            const index = stuckArrows.indexOf(savedArrow);
                            if (index > -1) stuckArrows.splice(index, 1);
                        }, 3000);

                        showFeedback(`HIT! +${points}`, '#2ed573');
                    } else {
                        // Missed board - flies off much higher/outward naturally
                        showFeedback('MISS!', '#ff4757');
                    }

                    flyingArrow = null;
                }
            }
        }

        function drawPixelRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function drawScene() {
            // Sky background
            ctx.fillStyle = '#70a1ff';
            ctx.fillRect(0, 0, 800, 350);

            // Grass background
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(0, 350, 800, 250);

            // Centered target wooden stand pole
            drawPixelRect(390, 260, 20, 120, '#5c3a21');

            // Concentric Target Rings
            const rings = [
                { r: 80, color: '#ff4757' }, // Outer Red
                { r: 55, color: '#ffffff' }, // White Ring
                { r: 30, color: '#ff4757' }, // Inner Red
                { r: 12, color: '#2f3542'  } // Bullseye Dark
            ];

            rings.forEach(ring => {
                ctx.fillStyle = ring.color;
                ctx.beginPath();
                ctx.arc(target.x, target.y, ring.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.stroke();
            });

            // Stuck arrows rendering
            stuckArrows.forEach(arrow => {
                drawPixelRect(arrow.x - 2, arrow.y - 8, 4, 16, '#ffa502');
                ctx.fillStyle = '#ff6b81';
                ctx.fillRect(arrow.x - 4, arrow.y - 12, 8, 4);
            });
        }

        function drawBowAndArrow() {
            if (flyingArrow) {
                const size = Math.max(8, flyingArrow.scale * 40);
                drawPixelRect(flyingArrow.x - size/4, flyingArrow.y - size, size/2, size * 2, '#ffa502');
            } else {
                // Bow body at bottom center
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(400, 520, 60, Math.PI, 0, false);
                ctx.stroke();

                if (isAiming) {
                    // Bowstring pulled back dynamically
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(340, 520);
                    ctx.lineTo(currentX, currentY);
                    ctx.lineTo(460, 520);
                    ctx.stroke();

                    // Arrow loaded on string
                    drawPixelRect(currentX - 3, currentY - 20, 6, 40, '#eccc68');
                }
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, 800, 600);
            drawScene();
            update();
            drawBowAndArrow();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
