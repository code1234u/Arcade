<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Archery Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #fff;
            background: #2ed573;
            overflow: hidden;
            cursor: crosshair;
            image-rendering: pixelated;
        }
        #score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 2px solid #fff;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">SCORE: 0</div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');

        let score = 0;

        // Target position in the distance
        const target = {
            x: 400,
            y: 220,
            radius: 70
        };

        // Aiming and shooting state
        let isAiming = false;
        let startX = 400;
        let startY = 500;
        let currentX = 400;
        let currentY = 500;

        let flyingArrow = null;

        // Input listeners
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Click near the bottom center bow area to pull
            if (!flyingArrow && Math.hypot(mouseX - 400, mouseY - 500) < 120) {
                isAiming = true;
                startX = 400;
                startY = 500;
                currentX = mouseX;
                currentY = mouseY;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isAiming) return;
            const rect = canvas.getBoundingClientRect();
            currentX = e.clientX - rect.left;
            currentY = e.clientY - rect.top;
        });

        window.addEventListener('mouseup', () => {
            if (!isAiming) return;
            isAiming = false;

            // Calculate launch velocity based on pull distance/direction
            const dx = startX - currentX;
            const dy = startY - currentY;

            flyingArrow = {
                x: 400,
                y: 500,
                vx: dx * 0.12,
                vy: dy * 0.12,
                scale: 1.0
            };
        });

        function update() {
            if (flyingArrow) {
                flyingArrow.x += flyingArrow.vx;
                flyingArrow.y += flyingArrow.vy;
                flyingArrow.scale -= 0.02; // Shrinks as it travels into the distance

                // When arrow reaches target depth
                if (flyingArrow.scale <= 0.3) {
                    const dist = Math.hypot(flyingArrow.x - target.x, flyingArrow.y - target.y);

                    if (dist < target.radius) {
                        // Score calculation based on accuracy
                        if (dist < 15) score += 10;       // Bullseye
                        else if (dist < 35) score += 5;   // Inner ring
                        else score += 2;                  // Outer ring
                        scoreBoard.innerText = `SCORE: ${score}`;
                    }
                    flyingArrow = null;
                }
            }
        }

        function drawPixelRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function drawScene() {
            // Sky
            ctx.fillStyle = '#70a1ff';
            ctx.fillRect(0, 0, 800, 350);

            // Grass background
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(0, 350, 800, 250);

            // Target wooden stand
            drawPixelRect(390, 280, 20, 100, '#5c3a21');

            // Target rings (Pixelated concentric circles)
            const rings = [
                { r: 70, color: '#ff4757' }, // Red
                { r: 50, color: '#ffffff' }, // White
                { r: 30, color: '#ff4757' }, // Red
                { r: 12, color: '#2f3542' }  // Bullseye
            ];

            rings.forEach(ring => {
                ctx.fillStyle = ring.color;
                ctx.beginPath();
                ctx.arc(target.x, target.y, ring.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.stroke();
            });
        }

        function drawBowAndArrow() {
            if (flyingArrow) {
                // Draw flying arrow shrinking in perspective
                const size = Math.max(8, flyingArrow.scale * 40);
                drawPixelRect(flyingArrow.x - size/4, flyingArrow.y - size, size/2, size * 2, '#ffa502');
            } else {
                // Bow body at bottom center
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(400, 520, 60, Math.PI, 0, false);
                ctx.stroke();

                if (isAiming) {
                    // Bow string pulled back to mouse
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(340, 520);
                    ctx.lineTo(currentX, currentY);
                    ctx.lineTo(460, 520);
                    ctx.stroke();

                    // Arrow shaft ready to launch
                    drawPixelRect(currentX - 3, currentY - 20, 6, 40, '#eccc68');
                }
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, 800, 600);
            drawScene();
            update();
            drawBowAndArrow();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
