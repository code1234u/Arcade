<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Archery Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #fff;
            background: #2ed573;
            overflow: hidden;
            cursor: crosshair;
            image-rendering: pixelated;
        }
        #score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 2px solid #fff;
            letter-spacing: 2px;
        }
        #feedback-display {
            position: absolute;
            top: 150px;
            width: 100%;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 4px 4px #000;
            display: none;
            pointer-events: none;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">SCORE: 0</div>
        <div id="feedback-display"></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const feedbackDisplay = document.getElementById('feedback-display');

        let score = 0;

        // Target position in the distance
        const target = {
            x: 400,
            y: 220,
            radius: 70
        };

        // Aiming and shooting state
        let isAiming = false;
        let startX = 400;
        let startY = 500;
        let currentX = 400;
        let currentY = 500;

        let flyingArrow = null;
        let stuckArrows = []; // Stores arrows that hit the target board
        let feedbackTimeout = null;

        // Input listeners
        canvas.addEventListener('mousedown', (e) => {
            if (flyingArrow) return; // Can't shoot while one is in the air
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (Math.hypot(mouseX - 400, mouseY - 500) < 120) {
                isAiming = true;
                startX = 400;
                startY = 500;
                currentX = mouseX;
                currentY = mouseY;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isAiming) return;
            const rect = canvas.getBoundingClientRect();
            currentX = e.clientX - rect.left;
            currentY = e.clientY - rect.top;
        });

        window.addEventListener('mouseup', () => {
            if (!isAiming) return;
            isAiming = false;

            const dx = startX - currentX;
            const dy = startY - currentY;

            flyingArrow = {
                x: 400,
                y: 500,
                vx: dx * 0.12,
                vy: dy * 0.12,
                scale: 1.0
            };
        });

        function showFeedback(text, color) {
            feedbackDisplay.innerText = text;
            feedbackDisplay.style.color = color;
            feedbackDisplay.style.display = 'block';

            if (feedbackTimeout) clearTimeout(feedbackTimeout);

            feedbackTimeout = setTimeout(() => {
                feedbackDisplay.style.display = 'none';
            }, 3000);
        }

        function update() {
            if (flyingArrow) {
                flyingArrow.x += flyingArrow.vx;
                flyingArrow.y += flyingArrow.vy;
                flyingArrow.scale -= 0.02; // Shrinks as it travels into the distance

                // When arrow reaches target depth
                if (flyingArrow.scale <= 0.3) {
                    const dist = Math.hypot(flyingArrow.x - target.x, flyingArrow.y - target.y);

                    if (dist < target.radius) {
                        // Hit target
                        let points = 2;
                        if (dist < 15) points = 10;       // Bullseye
                        else if (dist < 35) points = 5;   // Inner ring

                        score += points;
                        scoreBoard.innerText = `SCORE: ${score}`;

                        // Save arrow position on the board so it sticks there
                        const savedArrow = { x: flyingArrow.x, y: flyingArrow.y };
                        stuckArrows.push(savedArrow);

                        // Remove arrow after 3 seconds along with feedback
                        setTimeout(() => {
                            const index = stuckArrows.indexOf(savedArrow);
                            if (index > -1) {
                                stuckArrows.splice(index, 1);
                            }
                        }, 3000);

                        showFeedback(`HIT! +${points}`, '#2ed573');
                    } else {
                        // Missed target
                        showFeedback('MISS!', '#ff4757');
                    }

                    flyingArrow = null;
                }
            }
        }

        function drawPixelRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function drawScene() {
            // Sky
            ctx.fillStyle = '#70a1ff';
            ctx.fillRect(0, 0, 800, 350);

            // Grass background
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(0, 350, 800, 250);

            // Target wooden stand
            drawPixelRect(390, 280, 20, 100, '#5c3a21');

            // Target rings (Pixelated concentric circles)
            const rings = [
                { r: 70, color: '#ff4757' }, // Red
                { r: 50, color: '#ffffff' }, // White
                { r: 30, color: '#ff4757' }, // Red
                { r: 12, color: '#2f3542' }  // Bullseye
            ];

            rings.forEach(ring => {
                ctx.fillStyle = ring.color;
                ctx.beginPath();
                ctx.arc(target.x, target.y, ring.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.stroke();
            });

            // Draw all arrows currently stuck on the target board
            stuckArrows.forEach(arrow => {
                drawPixelRect(arrow.x - 2, arrow.y - 8, 4, 16, '#ffa502');
                ctx.fillStyle = '#ff6b81';
                ctx.fillRect(arrow.x - 4, arrow.y - 12, 8, 4); // Arrow fletching
            });
        }

        function drawBowAndArrow() {
            if (flyingArrow) {
                // Draw flying arrow shrinking in perspective
                const size = Math.max(8, flyingArrow.scale * 40);
                drawPixelRect(flyingArrow.x - size/4, flyingArrow.y - size, size/2, size * 2, '#ffa502');
            } else {
                // Bow body at bottom center
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(400, 520, 60, Math.PI, 0, false);
                ctx.stroke();

                if (isAiming) {
                    // Bow string pulled back to mouse
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(340, 520);
                    ctx.lineTo(currentX, currentY);
                    ctx.lineTo(460, 520);
                    ctx.stroke();

                    // Arrow shaft ready to launch
                    drawPixelRect(currentX - 3, currentY - 20, 6, 40, '#eccc68');
                }
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, 800, 600);
            drawScene();
            update();
            drawBowAndArrow();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
